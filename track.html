<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Your Booking — Ember &amp; Quill</title>
  <meta name="description" content="Track an Ember &amp; Quill order or reservation with your tracking code and phone number.">
  <meta property="og:title" content="Track Your Booking — Ember & Quill">
  <meta property="og:description" content="Track your order or reservation with your tracking code and phone number.">
  <meta property="og:image" content="https://ember-and-quill.vercel.app/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ember-and-quill.vercel.app/track.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Track Your Booking — Ember & Quill">
  <meta name="twitter:description" content="Track your order or reservation with your tracking code and phone number.">
  <meta name="twitter:image" content="https://ember-and-quill.vercel.app/og-image.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Instrument+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Track-page-only additions; the shared stylesheet is unchanged. */
    .track-banner.is-on-the-way,
    .track-banner.is-delivered {
      background-color: rgba(111, 191, 138, 0.16);
      border: 1px solid rgba(111, 191, 138, 0.5);
      color: #7FD69F;
    }

    .track-toast {
      position: fixed;
      left: 50%;
      bottom: 1.25rem;
      z-index: 2000;
      box-sizing: border-box;
      width: max-content;
      max-width: calc(100vw - 2rem);
      padding: 0.8rem 1.1rem;
      border-radius: 8px;
      border: 1px solid rgba(127, 214, 159, 0.5);
      background-color: #102016;
      color: #7FD69F;
      font-family: 'Instrument Sans', sans-serif;
      font-size: 0.9375rem;
      font-weight: 700;
      line-height: 1.4;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transform: translate(-50%, 0.75rem);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .track-toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .track-cancel-link {
      margin: 1rem 0 0;
      font-size: 0.875rem;
      line-height: 1.5;
      color: var(--muted);
    }

    .track-cancel-link a {
      color: var(--accent);
      font-weight: 600;
    }
  </style>
</head>
<body data-page="track">

  <div id="nav-mount"></div>

  <main class="page-content">

    <section>
      <div class="text-panel track-page-panel">
        <p class="section-label">Track</p>
        <h1 class="section-title">Find Your Booking</h1>
        <p class="section-text">Enter the tracking code from your confirmation and the phone number you booked with.</p>

        <form id="trackForm" class="order-form" novalidate>
          <div class="order-fields">
            <div class="order-field">
              <label for="trackCode">Tracking code</label>
              <input class="order-input" id="trackCode" name="code" type="text" inputmode="text"
                autocomplete="off" autocapitalize="characters" spellcheck="false"
                placeholder="XXXX-XXXX-XXXX-XXXX" maxlength="19" required>
            </div>
            <div class="order-field">
              <label for="trackPhone">Phone number</label>
              <input class="order-input" id="trackPhone" name="phone" type="tel" inputmode="tel"
                autocomplete="tel" placeholder="e.g. 0803 123 4567" required>
            </div>
          </div>

          <div id="trackError" class="order-message order-error" role="alert" hidden></div>
          <button type="submit" id="trackSubmit" class="btn btn-primary order-submit">Check</button>
        </form>

        <div id="trackResults" class="track-results" aria-live="polite" hidden></div>

        <p class="track-help">
          To cancel, use the cancel link shown on a booking that can still be cancelled.
          For anything else, call <a href="tel:+2347063134521">07063134521</a>.
        </p>
      </div>
    </section>

  </main>

  <div id="footer-mount"></div>
  <div id="trackToast" class="track-toast" role="status" aria-live="polite"></div>

  <!-- supabase-js v2 (jsDelivr) → site data → Supabase config → tracking helpers → track logic -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <script src="menu.js"></script>
  <script src="site.js"></script>
  <script src="supabase-config.js"></script>
  <script src="tracking-code.js"></script>
  <script src="track.js"></script>
</body>
</html>
