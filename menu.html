<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu — Ember &amp; Quill</title>
  <meta property="og:title" content="Menu — Ember & Quill">
  <meta property="og:description" content="Full menu — Starters, From the Fire, Mains, Desserts, Drinks.">
  <meta property="og:image" value="https://ember-and-quill.vercel.app/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ember-and-quill.vercel.app/menu.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Menu — Ember & Quill">
  <meta name="twitter:description" content="Full menu — Starters, From the Fire, Mains, Desserts, Drinks.">
  <meta name="twitter:image" content="https://ember-and-quill.vercel.app/og-image.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Instrument+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="menu">

  <div id="nav-mount"></div>

  <main class="page-content">
    <section>
      <div class="text-panel" style="text-align:center;">
        <p class="section-label">Full Menu</p>
        <h1 class="section-title">Ember &amp; Quill — Menu</h1>
        <p class="section-text">Prices in Nigerian Naira (₦). All dishes prepared to order.</p>
        <div style="margin-top:1.5rem;">
          <a href="order.html" class="btn btn-primary">Order Online</a>
        </div>
      </div>
    </section>

    <!-- Placeholder photos, replace with the restaurant's own photos -->
    <div id="menuContent"></div>
  </main>

  <div id="footer-mount"></div>

  <script src="menu.js"></script>
  <script src="site.js"></script>
  <script>
    document.getElementById('menuContent').innerHTML = siteConfig.menu.map(cat => `
      <section>
        <div class="text-panel">
          <h2 class="menu-category-title">${cat.category}</h2>
          <div class="menu-cards">
            ${cat.items.map(item => `
              <article class="menu-card">
                <img class="menu-card-img" src="images/${item.image}" alt="${item.name} — Ember & Quill menu photo" loading="lazy">
                <div class="menu-card-body">
                  <h3 class="menu-card-name">${item.name}</h3>
                  <p class="menu-card-desc">${item.desc}</p>
                  <div class="menu-card-price">${fmtPrice(item.price)}</div>
                </div>
              </article>
            `).join('')}
          </div>
        </div>
      </section>
    `).join('');
  </script>
</body>
</html>
