<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancel my order or reservation — Ember &amp; Quill</title>
  <meta name="description" content="Cancel an Ember &amp; Quill order or reservation with your tracking code and phone number.">
  <meta property="og:title" content="Cancel my order or reservation — Ember & Quill">
  <meta property="og:description" content="Cancel an order or reservation with your tracking code and phone number.">
  <meta property="og:image" content="https://ember-and-quill.vercel.app/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ember-and-quill.vercel.app/cancel.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Cancel my order or reservation — Ember & Quill">
  <meta name="twitter:description" content="Cancel an order or reservation with your tracking code and phone number.">
  <meta name="twitter:image" content="https://ember-and-quill.vercel.app/og-image.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Instrument+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="cancel">

  <div id="nav-mount"></div>

  <main class="page-content">

    <section>
      <div class="text-panel track-page-panel">
        <p class="section-label">Cancel</p>
        <h1 class="section-title">Cancel my order or reservation</h1>
        <p class="section-text">Enter the tracking code from your confirmation and the phone number you booked with.</p>

        <form id="cancelForm" class="order-form" novalidate>
          <div class="order-fields">
            <div class="order-field">
              <label for="cancelCode">Tracking code</label>
              <input class="order-input" id="cancelCode" name="code" type="text" inputmode="text"
                autocomplete="off" autocapitalize="characters" spellcheck="false"
                placeholder="XXXX-XXXX-XXXX-XXXX" maxlength="19" required>
            </div>
            <div class="order-field">
              <label for="cancelPhone">Phone number</label>
              <input class="order-input" id="cancelPhone" name="phone" type="tel" inputmode="tel"
                autocomplete="tel" placeholder="e.g. 0803 123 4567" required>
            </div>
          </div>

          <div id="cancelError" class="order-message order-error" role="alert" hidden></div>
          <button type="submit" id="cancelFind" class="btn btn-primary order-submit">Find my booking</button>
        </form>

        <div id="cancelMessage" class="order-message" role="status" hidden></div>
        <div id="cancelResults" class="track-results" aria-live="polite" hidden></div>

        <p class="track-help">
          No changes are made until you confirm. For anything else, call
          <a href="tel:+2347063134521">07063134521</a>.
        </p>
      </div>
    </section>

  </main>

  <div id="footer-mount"></div>

  <!-- supabase-js v2 (jsDelivr) → site data → Supabase config → tracking helpers → cancel logic -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <script src="menu.js"></script>
  <script src="site.js"></script>
  <script src="supabase-config.js"></script>
  <script src="tracking-code.js"></script>
  <script src="cancel.js"></script>
</body>
</html>
