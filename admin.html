<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Ember &amp; Quill</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Instrument+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <header class="admin-topbar">
    <div class="admin-brand">Ember &amp; Quill <span>Admin</span></div>
    <nav class="admin-tabs" id="adminTabs" aria-label="Admin sections" hidden>
      <button type="button" data-view="orders" class="active">Orders <span class="tab-badge" id="ordersBadge" hidden>0</span></button>
      <button type="button" data-view="reservations">Reservations <span class="tab-badge" id="reservationsBadge" hidden>0</span></button>
      <button type="button" data-view="customers">Customers</button>
      <button type="button" data-view="activity">Activity Log</button>
    </nav>
    <div class="admin-session" id="adminSession" hidden>
      <span class="admin-user" id="adminUserEmail"></span>
      <button type="button" id="signOutBtn" class="admin-signout">Sign out</button>
    </div>
  </header>

  <div id="liveNote" class="admin-live-note" hidden>
    <span class="admin-live-dot" aria-hidden="true"></span>
    <span>Live data</span>
    <span id="liveStatus" class="admin-live-status is-connecting" role="status">Connecting…</span>
    <button type="button" id="enableAlertsBtn" class="admin-enable-alerts" hidden>Enable alerts</button>
  </div>

  <div id="adminAlertStack" class="admin-alert-stack" aria-live="polite"></div>

  <div id="bootView" class="admin-boot">Checking session…</div>

  <div id="loginView" class="admin-login" hidden>
    <div class="admin-login-card">
      <p class="admin-login-label">Ember &amp; Quill</p>
      <h1 class="admin-login-title">Admin sign in</h1>
      <p class="admin-login-text">Sign in with your admin email and password.</p>
      <form id="loginForm" class="admin-login-form" novalidate>
        <label class="admin-field">
          <span>Email</span>
          <input id="loginEmail" class="admin-input" type="email" name="email" autocomplete="username" required>
        </label>
        <label class="admin-field">
          <span>Password</span>
          <input id="loginPassword" class="admin-input" type="password" name="password" autocomplete="current-password" required>
        </label>
        <div id="loginError" class="admin-login-error" role="alert" hidden></div>
        <button type="submit" id="loginBtn" class="btn-admin-primary admin-login-submit">Sign in</button>
      </form>
    </div>
  </div>

  <main class="admin-main" id="adminMain" hidden>

    <section id="view-orders" class="admin-view active">
      <div class="admin-view-head">
        <h1>Incoming Orders</h1>
        <div class="admin-filter-stack">
          <div class="admin-filters" id="statusFilters" role="group" aria-label="Filter orders"></div>
        </div>
      </div>
      <div id="ordersList" class="admin-list"></div>
    </section>

    <section id="view-reservations" class="admin-view">
      <div class="admin-view-head">
        <h1>Reservations</h1>
        <div class="admin-filters" id="reservationFilters" role="group" aria-label="Filter reservations by status"></div>
      </div>
      <div id="reservationsList" class="admin-list"></div>
    </section>

    <section id="view-customers" class="admin-view">
      <div class="admin-view-head">
        <h1>Customers</h1>
        <div class="admin-view-head-actions">
          <input id="customerSearch" class="admin-input admin-search" type="search" placeholder="Search name or phone" aria-label="Search customers">
        </div>
      </div>
      <div id="customersList" class="admin-list"></div>
    </section>

    <section id="view-activity" class="admin-view">
      <h1>Activity Log</h1>
      <div id="activityList" class="admin-list"></div>
    </section>

  </main>

  <div id="panelBackdrop" class="admin-backdrop"></div>
  <section id="panel" class="admin-panel" aria-label="Details panel">
    <button id="panelClose" type="button" class="admin-panel-close" aria-label="Close panel">&times;</button>
    <div id="panelContent"></div>
  </section>

  <div id="modal" class="admin-modal" role="dialog" aria-modal="true">
    <div class="admin-modal-card">
      <h2 id="modalTitle"></h2>
      <p id="modalBody"></p>
      <div id="modalFields"></div>
      <textarea id="modalInput" class="admin-input admin-textarea" placeholder="Reason..."></textarea>
      <div class="admin-modal-actions">
        <button id="modalCancel" type="button" class="btn-admin-ghost">Cancel</button>
        <button id="modalConfirm" type="button" class="btn-admin-primary">Confirm</button>
      </div>
    </div>
  </div>

  <div id="toast" class="admin-toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <script src="supabase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
