<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Ember &amp; Quill</title>
  <meta name="description" content="Choose a new password for your Ember &amp; Quill account.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Instrument+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="reset-password">

  <div id="nav-mount"></div>

  <main class="page-content">

    <section>
      <div class="text-panel reset-panel">
        <p class="section-label">Your Account</p>
        <h1 class="section-title">Reset Password</h1>
        <p class="section-text" id="resetIntro">Choose a new password for your Ember &amp; Quill account.</p>

        <div id="resetMessage" class="order-message" role="status" aria-live="polite" hidden></div>

        <form id="resetForm" class="order-form" novalidate hidden>
          <div class="order-field">
            <label for="resetPassword">New password</label>
            <input class="order-input" id="resetPassword" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" required>
          </div>
          <div class="order-field">
            <label for="resetConfirm">Confirm new password</label>
            <input class="order-input" id="resetConfirm" name="confirm" type="password" autocomplete="new-password" placeholder="Type it again" minlength="8" required>
          </div>
          <button type="submit" id="resetSubmit" class="btn btn-primary order-submit">Change password</button>
        </form>

        <div id="resetDone" class="order-message order-success" role="status" aria-live="polite" tabindex="-1" hidden>
          <p class="order-success-text">Password changed. You can now order.</p>
          <p class="order-success-text"><a href="menu.html">Back to the menu</a></p>
        </div>

        <div id="resetInvalid" hidden>
          <p class="section-text" id="resetInvalidText">This password reset link is invalid or has expired. Request a new one below and we will email it to you.</p>
          <form id="resetResendForm" class="order-form" novalidate>
            <div class="order-field">
              <label for="resetEmail">Email</label>
              <input class="order-input" id="resetEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
            </div>
            <button type="submit" id="resetResendBtn" class="btn btn-primary order-submit">Send a new link</button>
          </form>
        </div>

        <p class="track-help">
          Need help with your account? Call <a href="tel:+2347063134521">07063134521</a>.
        </p>
      </div>
    </section>

  </main>

  <div id="footer-mount"></div>

  <!-- supabase-js v2 (jsDelivr) → site data → Supabase config → customer accounts → reset password -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <script src="menu.js"></script>
  <script src="site.js"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
